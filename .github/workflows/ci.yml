name: Security & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Vite 7 requires ^20.19.0 || >=22.12.0 — cover both supported lines.
        node: [ 20, 22 ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        # Non-blocking: the repo has known pre-existing lint errors in
        # SecureChat.jsx and friendsStore.js. Keeping this soft means a lint
        # regression is still visible without masking the test results below.
        continue-on-error: true
        run: npm run lint

      - name: Run Security & Cryptographic Unit Tests
        run: |
          mkdir -p test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit-node${{ matrix.node }}.xml \
            src/*.test.js

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node }}
          path: test-results/
          retention-days: 14
          if-no-files-found: warn

  build:
    name: Build & Audit
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build Production Distribution
        run: npm run build

      - name: Verify Built Output Carries Strict CSP
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html \
            || { echo "::error::CSP meta tag missing from built dist/index.html"; exit 1; }
          if grep -q "unsafe-inline" dist/index.html; then
            echo "::error::Built CSP contains 'unsafe-inline'"; exit 1
          fi
          echo "Built output CSP verified."

      - name: Upload Production Build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
