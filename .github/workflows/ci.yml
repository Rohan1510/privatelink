name: Security & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run Linter
        run: npm run lint

      - name: Run Security & Cryptographic Unit Tests
        run: npm test

      - name: Build Production Distribution
        run: npm run build

      - name: Verify Production Output Headers
        run: node --test src/headers.test.js
